<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasty Bites - Cart</title>
  <link rel="stylesheet" href="cart.css">
</head>

<body>
  <div class="top">
    <div class="top-back">
      <button onclick="window.location.href='../home.html'" class="back-btn" aria-label="Back to menu">← Menu</button>
    </div>
    <div class="name">
      <h1>🎬 TASTY BITES</h1>
    </div>
    <div class="cart-header-icon">
      <button onclick="window.location.href='cart.html'" class="cart-btn" aria-label="Cart">
        🛒
        <span class="cart-badge">0</span>
      </button>
    </div>
  </div>

  <div class="cart-container">
    <div class="cart-title-row">
      <h2>YOUR ORDERS</h2>
      <button class="clear-cart-btn" onclick="clearCart()" title="Clear all items">Clear All</button>
    </div>

    <div id="cart-items"></div>

    <div class="order-summary">
      <div class="total">
        <span>Order Total:</span>
        <span id="total-price">$0.00</span>
      </div>
      <div class="bottum-button">
        <button id="checkout-btn" onclick="processPayment()">Process Payment</button>
      </div>
    </div>
  </div>
  
  <div class="extra-space"></div>

  <div class="bottumnav">
    <div class="nav-item" onclick="window.location.href='../home.html'">
      <span>🏠</span>
      Home
    </div>
    <div class="nav-item">
      <span>❤️</span>
      Favorites
    </div>
    <div class="nav-item active" onclick="window.location.href='cart.html'">
      <span class="nav-icon-wrapper">
        🛒
        <span class="cart-badge">0</span>
      </span>
      Cart
    </div>
    <div class="nav-item"onclick="window.location.href='../profile/prifile.html'">
      <span>👤</span>
      Profile
    </div>
  </div>

  <script src="cart.js"></script>
</body>

</html>
